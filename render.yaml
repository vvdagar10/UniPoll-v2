services:
  - type: web
    name: unipoll-score-smart
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD   # you type this in the Render dashboard; it is never stored in GitHub
        sync: false
      - key: AI_API_KEY       # optional: your Groq/Gemini key, so AI survives Render restarts
        sync: false
