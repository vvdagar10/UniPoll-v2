{% extends 'base.html' %}
{% block title %}Sign up - UniPoll Score Smart{% endblock %}
{% block auth %}
<div class="text-center mb-6 fade-up">
  <h1 class="font-serif text-3xl font-bold">UniPoll <span class="text-accent">Score Smart</span></h1>
</div>
<form method="post" class="bg-card border border-line rounded-xl p-6 space-y-4 fade-up">
  <h2 class="font-serif text-xl font-bold">Create your account</h2>
  <div>
    <label class="block text-sm font-semibold mb-1" for="name">Full name</label>
    <input id="name" name="name" required autofocus class="w-full border border-line rounded-lg px-3 py-2 bg-white">
  </div>
  <div>
    <label class="block text-sm font-semibold mb-1" for="email">Email</label>
    <input id="email" name="email" type="email" required class="w-full border border-line rounded-lg px-3 py-2 bg-white">
  </div>
  <div>
    <label class="block text-sm font-semibold mb-1" for="password">Password <span class="font-normal text-muted">(min 6 characters)</span></label>
    <input id="password" name="password" type="password" minlength="6" required class="w-full border border-line rounded-lg px-3 py-2 bg-white">
  </div>
  <div>
    <span class="block text-sm font-semibold mb-1">I want to</span>
    <div class="grid grid-cols-2 gap-3">
      <label class="cursor-pointer">
        <input type="radio" name="role" value="respondent" class="peer sr-only" checked>
        <div class="border border-line rounded-lg p-3 text-sm bg-white peer-checked:border-accent peer-checked:bg-red-50 transition-colors">
          <div class="font-semibold">Take polls</div><div class="text-muted text-xs">Respondent</div>
        </div>
      </label>
      <label class="cursor-pointer">
        <input type="radio" name="role" value="creator" class="peer sr-only">
        <div class="border border-line rounded-lg p-3 text-sm bg-white peer-checked:border-accent peer-checked:bg-red-50 transition-colors">
          <div class="font-semibold">Create polls</div><div class="text-muted text-xs">Creator</div>
        </div>
      </label>
    </div>
  </div>
  <button class="w-full bg-accent hover:bg-accentdark text-white font-semibold py-2.5 rounded-lg press">Sign up</button>
  <p class="text-sm text-center text-muted">Already registered? <a class="text-accent hover:underline" href="{{ url_for('login') }}">Log in</a></p>
</form>
{% endblock %}
